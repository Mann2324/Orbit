<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ORBIT — Solar System Explorer</title><meta name="description" content="An immersive interactive solar system explorer with time travel, orbital motion and planet details."><link rel="stylesheet" href="style.css"></head><body><canvas id="space"></canvas><div class="vignette"></div><header><a class="brand" href="#"><i></i>ORBIT</a><div class="live"><span></span> LIVE SYSTEM</div><button id="resetView">Solar System</button></header><aside id="intro"><small>INTERACTIVE ASTRONOMY</small><h1>Explore time.<br><em>Across space.</em></h1><p>Move through the Solar System, travel across dates and select a world to explore it.</p><div class="hint">Drag to orbit · Scroll to zoom · Move pointer at bottom to scrub time</div></aside><section id="planetPanel"><button class="close" id="closePlanet">×</button><small id="planetType"></small><h2 id="planetName"></h2><p id="planetDesc"></p><div class="stats"><div><span>DAY</span><b id="day"></b></div><div><span>YEAR</span><b id="year"></b></div><div><span>DISTANCE</span><b id="distance"></b></div><div><span>MOONS</span><b id="moons"></b></div></div></section><div id="labels"></div><footer><div class="dateblock"><small>SIMULATION DATE</small><strong id="dateLabel"></strong></div><div class="timeline"><span id="past">−1 YEAR</span><input id="timeRange" type="range" min="-3650" max="3650" value="0"><span id="future">+1 YEAR</span></div><div class="controls"><button id="today">NOW</button><button id="play">Ⅱ</button><select id="speed"><option value="1">1×</option><option value="10">10×</option><option value="100">100×</option><option value="1000">1000×</option></select></div></footer><script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.164.1/build/three.module.js","three/addons/":"https://unpkg.com/three@0.164.1/examples/jsm/"}}</script><script type="module" src="app.js"></script></body></htm
